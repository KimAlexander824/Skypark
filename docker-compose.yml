# СКАЙПАРК — все сервисы вместе. ЭТОТ ФАЙЛ — ДЛЯ РАЗРАБОТКИ.
#   docker compose up -d --build                       всё
#   docker compose up -d --scale recognition-worker=3  больше воркеров распознавания
# Настройки — в .env рядом с этим файлом (скопируйте .env.example).
#
# На сервере — вместе с продакшен-настройками (порты закрыты, пароль Redis, без Swagger):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

x-recognition: &recognition
  build: ./services/recognition
  restart: unless-stopped
  environment:
    APP_ENV: ${APP_ENV:-dev}
    # Шарды: 3 базы на одном сервере Postgres. В продакшене — разные серверы,
    # меняются только адреса. Порядок и число шардов после запуска не менять!
    SHARD_DATABASE_URLS: >-
      postgresql+psycopg://${POSTGRES_USER:-skypark}:${POSTGRES_PASSWORD}@db:5432/recognition_1,postgresql+psycopg://${POSTGRES_USER:-skypark}:${POSTGRES_PASSWORD}@db:5432/recognition_2,postgresql+psycopg://${POSTGRES_USER:-skypark}:${POSTGRES_PASSWORD}@db:5432/recognition_3
    REDIS_URL: redis://redis:6379
    FACE_ENGINE: ${FACE_ENGINE:-insightface}
    MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.5}
    MULTIPLE_FACES_MIN_RATIO: ${MULTIPLE_FACES_MIN_RATIO:-0.25}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
  # Веса модели — внутри образа (скачиваются при сборке и проверяются по sha256)

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skypark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      # Базы создаются при первом запуске (infra/postgres/init):
      # шарды распознавания, база backend и тестовые базы.
      POSTGRES_MULTIPLE_DATABASES: recognition_1,recognition_2,recognition_3,backend,recognition_test,recognition_test_2
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Только с этого компьютера (DBeaver, тесты). Из локальной сети и интернета недоступно.
      # В docker-compose.prod.yml порт закрыт совсем.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes  # очередь переживает перезапуск
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"  # только с этого компьютера; в продакшене закрыт
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ---------------- сервис распознавания (ядро) ----------------

  recognition-migrator:  # миграции на все шарды и выход
    <<: *recognition
    command: python -m app.migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  recognition-worker:  # берёт задачи из очереди BullMQ; масштабируется --scale
    <<: *recognition
    command: python -m app.worker
    healthcheck:  # воркер обновляет файл-пульс раз в 10 с; завис — docker перезапустит
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # загрузка модели
    depends_on:
      redis:
        condition: service_healthy
      recognition-migrator:
        condition: service_completed_successfully

  recognition-api:  # синхронный HTTP-вход для Swagger и отладки: http://localhost:8001/docs
    <<: *recognition
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      recognition-migrator:
        condition: service_completed_successfully

  # ---------------- backend (Акмаль) ----------------
  # Когда появится services/backend/Dockerfile, раскомментировать и дополнить:
  #
  # backend:
  #   build: ./services/backend
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skypark}:${POSTGRES_PASSWORD}@db:5432/backend
  #     REDIS_URL: redis://redis:6379   # очередь распознавания: см. docs/contracts/recognition.md
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  pgdata:
  redisdata:
