# Автотесты сервиса распознавания. Запускаются, только если PR меняет его файлы.
name: recognition

on:
  pull_request:
    paths: ["services/recognition/**", ".github/workflows/recognition.yml"]
  push:
    branches: [main]
    paths: ["services/recognition/**", ".github/workflows/recognition.yml"]

defaults:
  run:
    working-directory: services/recognition

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: skypark
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: recognition_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skypark"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://skypark:change-me@localhost:5432/recognition_test
      TEST_DATABASE_URL_2: postgresql+psycopg://skypark:change-me@localhost:5432/recognition_test_2
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/recognition/requirements*.txt

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Вторая тестовая база (второй шард)
        run: python -c "import psycopg; c = psycopg.connect('postgresql://skypark:change-me@localhost:5432/recognition_test', autocommit=True); c.execute('CREATE DATABASE recognition_test_2')"

      - name: Схема БД совпадает с миграциями
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          FACE_ENGINE: fake
        run: |
          alembic upgrade head
          alembic check

      - name: Тесты
        run: pytest -q
